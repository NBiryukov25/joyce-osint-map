<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joyce OSINT Map</title>
<style>
:root{--bg:#0b1016;--panel:#121b24;--line:#395064;--text:#d9e4ec;--muted:#8ea4b5;--hi:#56d6b0;--med:#e8bd64;--low:#ee8b79;--accent:#73a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#17283a 0,#0b1016 50%);color:var(--text);font:14px/1.45 system-ui,sans-serif}header{padding:24px 28px;border-bottom:1px solid #263746}h1{margin:0 0 5px;font-size:26px}header p{margin:0;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,input{background:#152330;border:1px solid #31495c;color:var(--text);border-radius:6px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}#map{min-height:680px;overflow:auto;border:1px solid #243847;border-radius:10px;background:#0d151d;padding:22px}.tree{display:flex;flex-direction:column;align-items:center;gap:8px}.node{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;background:var(--panel);padding:9px 13px;min-width:220px;max-width:300px;cursor:pointer;box-shadow:0 3px 12px #0005}.node:hover,.node.selected{outline:2px solid var(--accent)}.node small{display:block;color:var(--muted);margin-top:3px}.branch{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;width:100%;max-width:1100px;border-top:1px solid var(--line);padding:14px 8px}.branch-title{grid-column:1/-1;text-align:center;color:var(--hi);font-weight:700}.high{border-left-color:var(--hi)}.medium{border-left-color:var(--med)}.low,.unresolved{border-left-color:var(--low)}aside{background:var(--panel);border:1px solid #243847;border-radius:10px;padding:18px;min-height:300px}aside h2{margin-top:0;font-size:18px}.label{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 8px;margin:3px 3px 8px 0;color:var(--med)}a{color:var(--accent)}.note{color:var(--muted);word-break:break-word}.legend{color:var(--muted);font-size:12px;margin-top:14px}@media(max-width:850px){main{grid-template-columns:1fr}#map{min-height:500px}}
</style></head><body><header><h1>Joyce OSINT Map</h1><p>Interactive navigation over the current evidence graph. Select a node for metadata and source links.</p></header><main><section><div class="toolbar"><input id="filter" placeholder="Filter nodes…"><button id="expand">Expand all</button><button id="collapse">Collapse branches</button></div><div id="map"></div><div class="legend">Confidence: <span style="color:var(--hi)">high</span> · <span style="color:var(--med)">medium</span> · <span style="color:var(--low)">low / unresolved</span></div></section><aside id="detail"><h2>Select a node</h2><p class="note">The map keeps generated analysis subordinate to primary and direct-source evidence.</p></aside></main>
<script>
const data={"title":"Joyce OSINT Map","nodes":[{"id":"joyce","label":"Joyce Tagudin Espiritu","type":"person","confidence":"high","summary":"Canonical Joyce entity."},{"id":"identity","label":"Identity","type":"branch","confidence":"high"},{"id":"confirmed","label":"Mary Joyce Tagudin Espiritu","type":"name","confidence":"high","summary":"Confirmed name in K-1 source."},{"id":"short","label":"Joyce Espiritu","type":"name","confidence":"high","summary":"Established short form."},{"id":"aliases","label":"Aliases","type":"branch","confidence":"unresolved"},{"id":"mary-sheryl","label":"Mary Joyce Sheryl Tagudin Espiritu","type":"alias","confidence":"medium","summary":"Generated-source claim; not canonicalized."},{"id":"sheng","label":"Sheng Tagudin Espiritu","type":"alias/account","confidence":"low","summary":"Unresolved alias/account attribution."},{"id":"sheryl-urma","label":"Sheryl Urma","type":"alias","confidence":"low","summary":"Unresolved candidate alias."},{"id":"urmakath","label":"Urmakath","type":"alias/username","confidence":"low","summary":"Unresolved candidate alias or username."},{"id":"people","label":"People and relationships","type":"branch","confidence":"high"},{"id":"Person A","label":"Person A","type":"person","confidence":"high","summary":"K-1 petitioner; Joyce relationship context."},{"id":"Person B","label":"Person B","type":"person","confidence":"medium","summary":"Related person in supporting source material."},{"id":"places","label":"Places and addresses","type":"branch","confidence":"medium"},{"id":"tuao","label":"Tuao, Cagayan, Philippines","type":"place","confidence":"medium","summary":"Historical/birthplace association."},{"id":"lebanon","label":"8 Moaweed Street, Zhagarta","type":"place","confidence":"medium","summary":"Former address, source-reported."},{"id":"hing-fat","label":"84 Hing Fat Street, Hong Kong","type":"place","confidence":"medium","summary":"Former address, source-reported."},{"id":"stubbs","label":"43 Stubbs Road, Wanchai","type":"place","confidence":"medium","summary":"Filing-time address; equivalence uncertain."},{"id":"organizations","label":"Organizations and employment","type":"branch","confidence":"medium"},{"id":"accounts","label":"Accounts and platforms","type":"branch","confidence":"unresolved"},{"id":"platforms","label":"Badoo · Facebook Messenger · WhatsApp","type":"platform","confidence":"medium","summary":"Platforms documented; exact attribution limited."},{"id":"communications","label":"Communications","type":"branch","confidence":"high"},{"id":"messenger","label":"Joyce Messenger Archive","type":"source/archive","confidence":"high","summary":"Canonical external archive; chats are primary evidence."},{"id":"timeline","label":"Timeline","type":"branch","confidence":"high"},{"id":"evidence","label":"Evidence and sources","type":"branch","confidence":"high"},{"id":"k1","label":"K-1 Visa Documentation","type":"official source","confidence":"high","summary":"Official-document context."},{"id":"gmail","label":"Gmail shipping correspondence","type":"direct communication","confidence":"high","summary":"Direct communication source."},{"id":"generated","label":"Generated dossiers and analyses","type":"secondary source","confidence":"medium","summary":"Interpretive material only."},{"id":"questions","label":"Contradictions and open questions","type":"branch","confidence":"unresolved","summary":"Identity, account, address, and description conflicts."},{"id":"identity-review","label":"Identity/account review","type":"system review","confidence":"unresolved","summary":"Evidence matrix and attribution review."}],"edges":[["joyce","identity"],["identity","confirmed"],["identity","short"],["joyce","aliases"],["aliases","mary-sheryl"],["aliases","sheng"],["aliases","sheryl-urma"],["aliases","urmakath"],["joyce","people"],["people","Person A"],["people","Person B"],["joyce","places"],["places","tuao"],["places","lebanon"],["places","hing-fat"],["places","stubbs"],["joyce","organizations"],["joyce","accounts"],["accounts","platforms"],["joyce","communications"],["communications","messenger"],["joyce","timeline"],["joyce","evidence"],["evidence","k1"],["evidence","gmail"],["evidence","generated"],["joyce","questions"],["joyce","identity-review"]]};
const by=Object.fromEntries(data.nodes.map(n=>[n.id,n])), children={}; data.edges.forEach(([a,b])=>(children[a]??=[]).push(b)); const map=document.querySelector('#map'),detail=document.querySelector('#detail'),filter=document.querySelector('#filter');
function node(n){let d=document.createElement('div');d.className='node '+(n.confidence||'');d.dataset.id=n.id;d.innerHTML='<b>'+n.label+'</b><small>'+n.type+(n.confidence?' · '+n.confidence:'')+'</small>';d.onclick=()=>show(n);return d}
function branch(id,visible=true){let b=document.createElement('div');b.className='branch';b.dataset.parent=id;let t=document.createElement('div');t.className='branch-title';t.textContent=by[id].label;b.append(t);(children[id]||[]).forEach(cid=>{let wrap=document.createElement('div');wrap.append(node(by[cid]));if(children[cid])wrap.append(branch(cid));b.append(wrap)});return b}
function render(){map.innerHTML='';let root=node(by.joyce);root.onclick=()=>show(by.joyce);map.append(root);(children.joyce||[]).forEach(id=>map.append(branch(id)))}
function show(n){detail.innerHTML='<h2>'+n.label+'</h2><div class="pill">'+(n.confidence||'not rated')+'</div><p class="label">Type</p><p>'+n.type+'</p>'+(n.summary?'<p class="label">Summary</p><p>'+n.summary+'</p>':'')+(n.note?'<p class="label">Vault note</p><p class="note">'+n.note+'</p>':'')+'<p class="label">Evidence rule</p><p class="note">Confidence is inherited from the vault representation; this map does not upgrade claims.</p>'}
document.querySelector('#expand').onclick=()=>document.querySelectorAll('.branch').forEach(x=>x.style.display='grid');document.querySelector('#collapse').onclick=()=>document.querySelectorAll('.branch').forEach((x,i)=>{if(i>0)x.style.display='none'});filter.oninput=()=>document.querySelectorAll('.node').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(filter.value.toLowerCase())?'block':'none');render();
</script></body></html>
